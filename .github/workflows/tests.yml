name: Tests

on:
  push:
    branches:
      - '**'
      - '!gh-pages'
  pull_request:
    branches:
      - '**'
      - '!gh-pages'
  schedule:
    - cron: '0 4 * * 1'  # Mondays 04:00 UTC: test against the newest dependency versions
  workflow_dispatch:

jobs:
  # pre-commit hooks on all files (hygiene, ruff check, ruff format, ...)
  lint:
    name: lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint with tox
        run: uvx --with tox-uv tox -e lint

  # xtl-core on its own: without xtl and the scientific stack
  core:
    name: core / ubuntu-latest / py${{ matrix.python-version }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install xtl-core alone
        run: uv sync --package xtl-core --group test --group lint --locked --python "$PYTHON_VERSION"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Check that xtl and the scientific stack are not installed
        run: >-
          uv run --no-sync python -c "import sys, importlib.util as u;
          found = [m for m in ('xtl', 'numpy', 'pandas', 'gemmi') if u.find_spec(m)];
          sys.exit(f'Installed, but must not be: {found}' if found else 0)"

      - name: Test
        run: uv run --no-sync pytest packages/xtl-core/tests

      - name: Check that xtl-core never imports xtl
        run: uv run --no-sync lint-imports --config packages/xtl-core/pyproject.toml

  # Locked dependencies (uv.lock) through tox-uv, as when testing locally
  uv:
    name: uv / ${{ matrix.os }} / py${{ matrix.python-version }}
    if: github.event_name != 'schedule'
    needs: core  # the full suite only runs once xtl-core passes on its own
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Check that uv.lock is up to date
        run: uv lock --check

      - name: Test with tox
        shell: bash
        run: uvx --with tox-uv tox -e "py${PYTHON_VERSION//./}"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

  # Lowest supported versions of the direct dependencies (the `>=` bounds in pyproject.toml)
  # Runs on Python 3.10, since older releases often have no wheels for newer Pythons.
  lowest:
    name: lowest / ${{ matrix.os }}
    if: github.event_name != 'schedule'
    needs: core  # the full suite only runs once xtl-core passes on its own
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Test with tox
        run: uvx --with tox-uv tox -e lowest

  # Non-editable install of the built package with pip, as users install it
  pip:
    name: pip / ${{ matrix.os }} / py${{ matrix.python-version }}
    if: github.event_name != 'schedule'
    needs: core  # the full suite only runs once xtl-core passes on its own
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install xtl and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/xtl-core . --group test  # xtl-core from the repo, not PyPI

      - name: Test with pytest
        run: pytest -v

  # Newest versions of all dependencies, ignoring uv.lock (weekly or on demand)
  upgrade:
    name: upgrade / ${{ matrix.os }} / py${{ matrix.python-version }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Upgrade uv.lock to the newest versions
        run: uv lock --upgrade

      - name: Test with tox
        shell: bash
        run: uvx --with tox-uv tox -e "py${PYTHON_VERSION//./}"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
