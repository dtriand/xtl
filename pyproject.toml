[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "xtl"
dynamic = ["version"]
authors = [
    {name = "Dimitris P. Triandafillidis", email = "64985525+dtriand@users.noreply.github.com"}
]
description = "A collection of tools for macromolecular crystallography"
keywords = ["x-ray", "diffraction", "crystallography", "macromolecular", "structural", "biology",
            "autoPROC", "PDB"]
readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=25.1.0",
    "click>=8.4.1",
    "defusedxml>=0.7.1",
    "distro>=1.9.0",
    "fabio>=2024.4.0",
    "f90nml>=1.5.0",
    "gemmi>=0.5.5",
    "h5py>=3.16.0",
    "hdf5plugin>=6.0.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pint>=0.24.4",
    "platformdirs>=4.0.0",
    "pydantic>=2.13.4",
    "pyfai>=2023.9.0",
    "pyxray>=1.8.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tabulate>=0.10.0",
    "toml>=0.10.2",
    "typer>=0.26.7",
    "xlsxwriter>=3.2.9",
    "xtl-core[extra]>=0.1.0.dev0,<0.2",
]

[project.urls]
homepage = "https://github.com/dtriand/xtl"

[project.scripts]
xtl = "xtl.cli.cli:cli_main"
pdbapi = "xtl.cli.cli_pdbapi:cli_pdbapi"
diffplot = "xtl.cli.cli_diffplot:app"
difftegrate = "xtl.cli.cli_difftegrate:app"
h5peek = "xtl.cli.cli_h5peek:app"
"xtl.autoproc" = "xtl.cli.autoproc:app"
"xtl.config" = "xtl.cli.config:app"
"xtl.diffraction" = "xtl.cli.diffraction:app"
"xtl.math" = "xtl.cli.math:app"
"xtl.nanobragg" = "xtl.cli.nanobragg:app"
"xtl.saxs" = "xtl.cli.saxs:app"

[dependency-groups]
test = [
    "pytest>=7.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.3.1",
]
docs = [
    "autodoc_pydantic>=2.2.0",
    "sphinx>=8.1.3",
    "sphinx-book-theme>=1.1.3",
    "sphinx-design>=0.6.1",
    "sphinx-favicon>=1.0.1"
]
lint = [
    "pre-commit>=4.0",
    "ruff>=0.17.3",
]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    {include-group = "lint"},
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
xtl-core = { workspace = true }

[tool.hatch.version]
source = "regex"
path = "src/xtl/config/version.py"
pattern = '''VersionInfo\.from_str\('(?P<version>[^']+)'''

[tool.hatch.build.targets.wheel]
packages = ["src/xtl"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E4",      # imports: one per line, at the top of the file
    "E7",      # statements: `== None/True`, `not x in`, bare `except`, `type(x) ==`, lambdas, names `l`/`O`/`I`
    "E9",      # unreadable files (syntax errors are always reported)
    "F",       # pyflakes: undefined names, unused imports/variables, star imports, ...
    "W605",    # invalid escape sequences like '\d'
    "RUF100",  # unused or unknown `# noqa` comments
]
ignore = [
    "E731",  # lambda assignments
]

[tool.tox]
requires = ["tox>=4.22", "tox-uv>=1.11"]
env_list = ["lint", "py310", "py311", "py312", "py313", "py314", "lowest"]

[tool.tox.env_run_base]
description = "Run tests on {env_name} with the locked dependencies"
runner = "uv-venv-lock-runner"
dependency_groups = ["test"]
commands = [["pytest", "-xvs", { replace = "posargs", extend = true }]]

[tool.tox.env.lowest]
description = "Run tests with the lowest supported versions of the direct dependencies"
runner = "uv-venv-runner"
base_python = ["3.10"]
uv_resolution = "lowest-direct"
deps = ["{tox_root}/packages/xtl-core"]  # not released yet, so not from PyPI

[tool.tox.env.docs]
description = "Build the documentation"
base_python = ["3.11"]
dependency_groups = ["docs"]
commands = [["sphinx-build", "-q", "-b", "html", "docs/source", "{env_tmp_dir}/html"]]

[tool.tox.env.lint]
description = "Run the pre-commit hooks on all files"
runner = "uv-venv-runner"  # the lock runner would install xtl and its dependencies too
skip_install = true
dependency_groups = ["lint"]
pass_env = ["PRE_COMMIT_HOME"]
commands = [["pre-commit", "run", "--all-files", "--show-diff-on-failure", { replace = "posargs", extend = true }]]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/xtl-core/tests"]
timeout = 300
markers = [
    "requires_network: Tests requiring a network connection",
    "make_temp_files: Tests that create temporary files"
]
tmp_path_retention_policy = "failed"
asyncio_default_fixture_loop_scope = "session"
